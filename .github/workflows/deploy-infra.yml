name: Deploy infrastructure (Bicep)

# Provisions/updates the Azure infrastructure defined in infra/main.bicep
# (Container Apps environment + apps, Azure OpenAI, Cosmos DB, Log Analytics).
#
# Authentication uses Entra Workload Identity Federation (OIDC) — NO secrets or
# tokens are stored in the repository. Configure these repo secrets once:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Optional repo variables: AZURE_RESOURCE_GROUP, AZURE_LOCATION

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-githubiq' }}
  LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        run: az group create -n "$RESOURCE_GROUP" -l "$LOCATION" -o none

      - name: Validate Bicep
        run: az deployment group validate -g "$RESOURCE_GROUP" -f infra/main.bicep

      - name: Deploy Bicep
        run: az deployment group create -g "$RESOURCE_GROUP" -f infra/main.bicep -o table
